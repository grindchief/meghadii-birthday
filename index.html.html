<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Quicksand,sans-serif;background:linear-gradient(135deg,#ffd6e7,#ffc2d9,#ffb3c6,#ff8fab);color:#7a1648}
.screen{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;padding:20px;opacity:0;transform:translateY(25px);transition:.7s;pointer-events:none}
.active{opacity:1;transform:none;pointer-events:auto}
.card{background:rgba(255,255,255,.45);backdrop-filter:blur(12px);padding:25px;border-radius:25px;max-width:900px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1,h2{font-family:Great Vibes,cursive;color:#c2185b}
h1{font-size:5rem;margin:0}
.btn{padding:16px 32px;min-height:55px;border:none;border-radius:999px;background:#ff4d88;color:white;font-weight:700;font-size:18px;cursor:pointer;transition:.3s}
.btn:hover{background:#e91e63;transform:translateY(-4px) scale(1.05)}
#gift{font-size:130px;cursor:pointer;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.photo{width:min(500px,90vw);height:min(500px,90vw);object-fit:cover;border-radius:20px;transition:.5s}
.music{position:fixed;top:10px;right:10px}
.cursor-heart{position:fixed;pointer-events:none;font-size:16px;z-index:9999}
.float-heart{position:fixed;pointer-events:none;color:#ff4d88;animation:up 8s linear forwards}
@keyframes up{from{transform:translateY(100vh)}to{transform:translateY(-100px);opacity:0}}

@media (max-width:768px){
#gift{font-size:160px}
h1{font-size:4rem}
p{font-size:18px}
.photo{width:90vw;height:auto;aspect-ratio:1/1;object-fit:cover}
}

</style>

const txt=`Through all the change and controversy, you've been by my side.\n\nThere's no girl in the world who would rather give me such a good time.\n\nIt's been a wild ride, so while I can still be heard...\n\nHere's one hubbyfist to the number one girl in the world ❤️\n\n— Arham`;
let i=0;
(function type(){ if(i<txt.length){letter.innerHTML+=txt[i]=='\n'?'<br>':txt[i];i++;setTimeout(type,25);} })();

const noBtn=document.getElementById('noBtn');
noBtn.addEventListener('mouseover',()=>{
const x=20+Math.random()*50;
const y=20+Math.random()*50;
noBtn.style.position='fixed';
noBtn.style.left=x+'vw';
noBtn.style.top=y+'vh';
});

function yes(){confettiBlast();show('s5');}

const reasons=["Because you stayed by my side ❤️","Because your smile makes bad days better ❤️","Because life is more fun with you ❤️","Because distance never changed how I feel ❤️","Because you're Meghadii ❤️"];
let r=0;
function nextReason(){
if(r<reasons.length){reason.innerHTML='<h3>'+reasons[r++]+'</h3>';confettiBlast();}
else{show('s6');setInterval(confettiBlast,3000);}
}

days.innerText=Math.floor((new Date()-new Date('2025-08-01'))/86400000);

let last=0;
document.addEventListener('mousemove',e=>{
if(Date.now()-last<80)return;
last=Date.now();
const h=document.createElement('div');
h.className='cursor-heart';
h.innerHTML='❤️';
h.style.left=e.pageX+'px';
h.style.top=e.pageY+'px';
document.body.appendChild(h);
setTimeout(()=>h.remove(),700);
});

setInterval(()=>{
const h=document.createElement('div');
h.className='float-heart';
h.innerHTML='❤️';
h.style.left=Math.random()*100+'vw';
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},1500);
</script>
